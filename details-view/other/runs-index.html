<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Other screens — Runs index</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/chrome.css">
<style>
  /* =================================================================
     Runs index (SPEC-OTHER §C). One dense grouped table, no cards.
     Everything here is page-local; shared/ is untouched.
     ================================================================= */

  /* --- topbar, rebuilt: this is the runs page, not a run --- */

  .topbar.is-runs {
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .runs-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-900);
  }
  .btn-brand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 11px;
    border-radius: var(--radius-sm);
    background: var(--brand);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn-brand:hover { background: #0b8177; }

  /* --- the centre scrolls; the widget must not sit on the last rows --- */

  .center {
    padding: 0 0 190px;
  }

  /* --- filter row --- */

  .filterbar {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 14px;
    height: 48px;
    padding: 0 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--hair);
  }
  .search {
    position: relative;
    flex: 0 0 240px;
    width: 240px;
  }
  .search-ico {
    position: absolute;
    left: 8px;
    top: 50%;
    margin-top: -6px;
    color: var(--ink-400);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 28px;
    padding: 0 10px 0 26px;
    border: 1px solid var(--hair-dark);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 12px;
    color: var(--ink-900);
  }
  .search input::placeholder { color: var(--ink-400); }
  .search input:focus { outline: 2px solid var(--azure); outline-offset: -1px; }

  .chips { display: flex; align-items: center; gap: 6px; }
  .chip {
    height: 24px;
    padding: 0 10px;
    border: 1px solid var(--hair-dark);
    border-radius: 999px;
    background: var(--surface);
    font-size: 12px;
    color: var(--ink-600);
    white-space: nowrap;
  }
  .chip:hover { color: var(--ink-900); border-color: var(--ink-200); }
  .chip.is-on {
    background: var(--ink-100);
    border-color: transparent;
    color: var(--ink-900);
    font-weight: 500;
  }

  .filter-gap { flex: 1 1 auto; min-width: 8px; }

  .seg {
    display: flex;
    align-items: center;
    border: 1px solid var(--hair-dark);
    border-radius: var(--radius-sm);
    overflow: hidden;
    flex: 0 0 auto;
  }
  .seg button {
    height: 24px;
    padding: 0 11px;
    font-size: 12px;
    color: var(--ink-600);
    background: var(--surface);
  }
  .seg button + button { border-left: 1px solid var(--hair-dark); }
  .seg button:hover { color: var(--ink-900); }
  .seg button.is-on { background: var(--ink-100); color: var(--ink-900); font-weight: 500; }

  /* --- the grid shared by the column head and every row --- */

  .grid {
    display: grid;
    grid-template-columns:
      24px minmax(0, 1fr) 92px 66px 78px 72px 86px 60px;
    gap: 14px;
    align-items: center;
    padding: 0 24px;
  }

  .colhead {
    position: sticky;
    top: 48px;
    z-index: 3;
    height: 30px;
    background: var(--surface);
    border-bottom: 1px solid var(--hair);
  }
  .ch {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--ink-600);
    min-width: 0;
  }
  .ch:hover { color: var(--ink-900); }
  .ch.is-sorted { color: var(--ink-900); font-weight: 500; }
  /* right-aligned headers put the (always-reserved) chevron slot on the LEFT,
     so the label's right edge lines up with the mono values below it */
  .ch.num { flex-direction: row-reverse; justify-content: flex-start; }
  .ch-static { font-size: 12px; color: var(--ink-600); }
  .chv { color: var(--ink-400); flex: 0 0 10px; }
  .ch.is-sorted .chv { color: var(--ink-900); }
  .chv.is-hidden { visibility: hidden; }
  .chv.is-up { transform: rotate(180deg); }

  /* --- groups --- */

  .rgroup + .rgroup { margin-top: 8px; }
  .ghead {
    position: sticky;
    top: 78px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--hair);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-900);
  }
  .gcount { color: var(--ink-400); font-weight: 400; }

  /* --- rows --- */

  .rrow {
    position: relative;
    height: 44px;
    border-bottom: 1px solid var(--hair);
  }
  .rrow:hover { background: var(--ground); }
  .rrow.is-focus { outline: 2px solid var(--azure); outline-offset: -2px; }

  .star-btn {
    position: relative;
    z-index: 1;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-sm);
    color: var(--ink-200);
  }
  .star-btn:hover { color: var(--ink-400); }
  .star-btn.is-on { color: var(--warn); }
  .star-btn.is-on svg { fill: currentColor; }

  .rmain { min-width: 0; }
  .rlink {
    display: block;
    font-size: 13px;
    color: var(--ink-900);
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rlink::after { content: ''; position: absolute; inset: 0; }
  .rrow:hover .rlink { text-decoration: underline; }
  .rlink:focus-visible { outline: none; }
  .rowner {
    margin-left: 7px;
    font-size: 11px;
    color: var(--ink-400);
  }
  .rsub {
    font-size: 12px;
    line-height: 1.35;
    color: var(--ink-600);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rstatus {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-700);
    min-width: 0;
  }
  .rstatus .glyph { flex: 0 0 10px; display: flex; }
  .rstatus .word { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rstatus.s-running { color: var(--ink-700); }
  .rstatus.s-running .glyph { color: var(--brand); }
  .rstatus.s-done .glyph { color: var(--ok); }
  .rstatus.s-failed { color: var(--danger); }
  .rstatus.s-failed .glyph { color: var(--danger); }
  .rstatus.s-waiting .glyph { color: var(--brand); }
  .rstatus.s-paused { color: var(--ink-600); }
  .rstatus.s-paused .glyph { color: var(--ink-400); }

  .num {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-900);
    text-align: right;
    white-space: nowrap;
  }
  .rstarted { font-size: 12px; color: var(--ink-600); white-space: nowrap; }
  .rtrend { display: flex; justify-content: flex-end; }

  .empty {
    padding: 28px 24px;
    font-size: 13px;
    color: var(--ink-400);
  }

  /* --- New run dialog (the prompt box, moved off the page) --- */

  .nr {
    width: 480px;
    max-width: calc(100vw - 32px);
    padding: 0;
    border: 1px solid var(--hair-dark);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink-900);
  }
  .nr::backdrop { background: rgba(26, 26, 46, .28); }
  .nr-form { padding: 16px; }
  .nr h2 { font-size: 14px; font-weight: 600; color: var(--ink-900); }
  .nr-sub { margin-top: 4px; font-size: 12px; color: var(--ink-600); }
  .nr-text {
    display: block;
    width: 100%;
    height: 108px;
    margin-top: 12px;
    padding: 9px 10px;
    border: 1px solid var(--hair-dark);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.45;
    resize: none;
  }
  .nr-text::placeholder { color: var(--ink-400); }
  .nr-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-quiet {
    height: 26px;
    padding: 0 11px;
    border: 1px solid var(--hair-dark);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--ink-700);
    background: var(--surface);
  }
  .btn-quiet:hover { background: var(--ground); }

  /* --- below 900 px: rounds and started go (SPEC-OTHER §C) --- */

  @media (max-width: 899px) {
    .grid {
      grid-template-columns: 24px minmax(0, 1fr) 92px 78px 72px 60px;
      gap: 12px;
    }
    .c-rounds, .c-started { display: none; }
    .filterbar { gap: 10px; padding: 0 16px; }
    .grid, .ghead { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body data-page="other/runs-index">
<div id="app"></div>

<dialog class="nr" id="nr-dialog" aria-label="New run">
  <form class="nr-form" id="nr-form">
    <h2>New run</h2>
    <p class="nr-sub">Describe what to investigate. The run opens at Create Idea.</p>
    <textarea class="nr-text" id="nr-text"
      placeholder="e.g. Does sparse retrieval pre-filtering help long-context QA above 8k tokens?"
      aria-label="What should this run investigate?"></textarea>
    <div class="nr-actions">
      <button type="button" class="btn-quiet" id="nr-cancel">Cancel</button>
      <button type="submit" class="btn-brand">Start run</button>
    </div>
  </form>
</dialog>

<script src="../shared/data.js"></script>
<script src="../shared/chrome.js"></script>
<script src="../shared/feedback.js"></script>
<script>
(function () {
  'use strict';
  var AII = window.AII;
  var el = AII.el, icon = AII.icon, esc = AII.escapeHtml;

  /* =================================================================
     0. Shell — no left tree, no right panel, no composer
     ================================================================= */

  var center = AII.renderShell(document.getElementById('app'), {
    title: 'Other screens',
    variant: 'Runs index',
    blurb: 'A real /runs page: four groups, one dense table, filters and sort. ' +
           'The prompt box becomes a New run dialog.',
    prev: 'progress-b.html',
    next: null,
    indexHref: '../index.html',
    hideLeft: true,
    hideRight: true,
    hideComposer: true
  });
  center.setAttribute('aria-label', 'Runs');

  /* --- rebuild the topbar: this page is the runs list, not one run --- */

  var topbar = document.querySelector('.topbar');
  topbar.innerHTML = '';
  topbar.classList.add('is-runs');
  topbar.appendChild(el('div', 'runs-title', 'Runs'));
  var newRunBtn = el('button', 'btn-brand');
  newRunBtn.type = 'button';
  newRunBtn.innerHTML = icon('plus', 12) + '<span>New run</span>';
  topbar.appendChild(newRunBtn);

  var dlg = document.getElementById('nr-dialog');
  var nrText = document.getElementById('nr-text');
  function openDialog() {
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    nrText.focus();
  }
  newRunBtn.addEventListener('click', openDialog);
  /* the sidebar's own New run button opens the same dialog */
  var sideNew = document.querySelector('.btn-newrun');
  if (sideNew) sideNew.addEventListener('click', openDialog);
  document.getElementById('nr-cancel').addEventListener('click', function () { dlg.close(); });
  document.getElementById('nr-form').addEventListener('submit', function (e) {
    e.preventDefault();
    dlg.close();
  });

  /* =================================================================
     1. Data shaping — grouping, ownership, parsing
     ================================================================= */

  var RUNS = (AII.RUNS || []).map(function (r) { return Object.assign({}, r); });

  /* "2 h ago" / "1 h 12 m ago" / "3 d ago" -> minutes, so relative strings
     can be sorted and grouped without inventing timestamps. */
  function minutes(s) {
    var t = String(s == null ? '' : s), n = 0, m;
    if ((m = t.match(/(\d+)\s*d/))) n += parseInt(m[1], 10) * 1440;
    if ((m = t.match(/(\d+)\s*h/))) n += parseInt(m[1], 10) * 60;
    if ((m = t.match(/(\d+)\s*m/))) n += parseInt(m[1], 10);
    return n;
  }

  /* RUNS carries no owner field, so a "mine / all" control would be dead.
     Four runs are assigned to teammates here, in the page, deterministically
     by id — enough for the control to do something visible. */
  var TEAMMATE = {
    '0x9C31': 'M. Reyes', '0x6B15': 'K. Osei',
    '0xE590': 'L. Bianchi', '0xA8E2': 'M. Reyes'
  };

  /* Older = the six oldest DONE runs (SPEC-OTHER §C). */
  var olderIds = {};
  RUNS.filter(function (r) { return r.status === 'done'; })
      .sort(function (a, b) { return minutes(b.started) - minutes(a.started); })
      .slice(0, 6)
      .forEach(function (r) { olderIds[r.id] = true; });

  var GROUPS = [
    { key: 'running', label: 'Running' },
    { key: 'needs', label: 'Needs you' },
    { key: 'recent', label: 'Recent' },
    { key: 'older', label: 'Older' }
  ];

  function groupOf(r) {
    if (r.status === 'running') return 'running';
    /* paused belongs with waiting: both are blocked on a person */
    if (r.status === 'waiting' || r.status === 'paused') return 'needs';
    return olderIds[r.id] ? 'older' : 'recent';
  }

  RUNS.forEach(function (r) {
    r.group = groupOf(r);
    r.owner = TEAMMATE[r.id] || '';
    r.ago = minutes(r.started);
    r.runMin = minutes(r.runtime);
    r.star = !!r.starred;
  });

  var STATUS_WORD = {
    running: 'Running', done: 'Done', failed: 'Failed',
    waiting: 'Waiting', paused: 'Paused'
  };
  var STATUS_RANK = { running: 0, waiting: 1, paused: 2, done: 3, failed: 4 };

  /* 10 px state glyphs (SPEC-OTHER §B vocabulary, colours from tokens) */
  var GLYPH = {
    running: '<circle cx="5" cy="5" r="3.7" fill="none" stroke="currentColor" stroke-width="1.3"/>' +
             '<circle cx="5" cy="5" r="1.5" fill="currentColor"/>',
    done: '<circle cx="5" cy="5" r="4.2" fill="currentColor"/>',
    failed: '<path d="M1.9 1.9 L8.1 8.1 M8.1 1.9 L1.9 8.1" fill="none" stroke="currentColor" ' +
            'stroke-width="1.7" stroke-linecap="round"/>',
    waiting: '<rect x="2.0" y="1.5" width="2.1" height="7" rx=".6" fill="currentColor"/>' +
             '<rect x="5.9" y="1.5" width="2.1" height="7" rx=".6" fill="currentColor"/>'
  };
  GLYPH.paused = GLYPH.waiting;

  function glyph(status) {
    return '<svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" ' +
      'focusable="false">' + (GLYPH[status] || GLYPH.done) + '</svg>';
  }

  /* 24 x 60 px cumulative-cost sparkline. Every run is drawn against the
     SAME ceiling (the dearest run), so the column compares runs — a per-row
     scale would draw eighteen identical diagonals and say nothing. */
  var COST_CEIL = RUNS.reduce(function (m, r) { return Math.max(m, r.cost); }, 1);

  function sparkSvg(vals, label) {
    var v = (vals && vals.length) ? vals : [0, 0];
    var max = COST_CEIL;
    var step = v.length > 1 ? 58 / (v.length - 1) : 0;
    var pts = v.map(function (n, i) {
      return (1 + i * step).toFixed(1) + ',' + (22 - (n / max) * 20).toFixed(1);
    });
    var last = pts[pts.length - 1].split(',');
    return '<svg viewBox="0 0 60 24" width="60" height="24" role="img" aria-label="' +
      esc(label) + '">' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--ink-400)" ' +
        'stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="1.5" fill="var(--ink-600)"/>' +
      '</svg>';
  }

  function money(n) { return '$' + Number(n).toFixed(2); }

  /* =================================================================
     2. View state
     ================================================================= */

  var state = { q: '', status: 'all', scope: 'all', sortKey: '', sortDir: 'asc' };

  var COLUMNS = [
    { key: 'star', label: '', sortable: false, cls: 'c-star' },
    { key: 'title', label: 'Run', sortable: true, cls: 'c-run' },
    { key: 'status', label: 'Status', sortable: true, cls: 'c-status' },
    { key: 'rounds', label: 'Rounds', sortable: true, cls: 'c-rounds', num: true },
    { key: 'runtime', label: 'Runtime', sortable: true, cls: 'c-runtime', num: true },
    { key: 'cost', label: 'Cost', sortable: true, cls: 'c-cost', num: true },
    { key: 'started', label: 'Started', sortable: true, cls: 'c-started' },
    { key: 'trend', label: 'Trend', sortable: false, cls: 'c-trend', num: true }
  ];

  var VALUE = {
    title: function (r) { return r.title.toLowerCase(); },
    status: function (r) { return STATUS_RANK[r.status]; },
    rounds: function (r) { return r.rounds; },
    runtime: function (r) { return r.runMin; },
    cost: function (r) { return r.cost; },
    started: function (r) { return r.ago; }
  };

  function compare(a, b) {
    var f = VALUE[state.sortKey];
    var x = f(a), y = f(b);
    var d = x < y ? -1 : (x > y ? 1 : 0);
    return state.sortDir === 'asc' ? d : -d;
  }

  function visible() {
    var q = state.q.trim().toLowerCase();
    return RUNS.filter(function (r) {
      if (state.scope === 'mine' && r.owner) return false;
      if (state.status !== 'all' && r.status !== state.status) return false;
      if (q && r.title.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  /* =================================================================
     3. Filter row
     ================================================================= */

  var bar = el('div', 'filterbar');

  var search = el('div', 'search');
  var sIco = el('span', 'search-ico');
  sIco.innerHTML = icon('search', 12);
  search.appendChild(sIco);
  var input = document.createElement('input');
  input.type = 'search';
  input.placeholder = 'Search runs';
  input.setAttribute('aria-label', 'Search runs by title');
  search.appendChild(input);
  bar.appendChild(search);
  input.addEventListener('input', function () { state.q = input.value; paint(); });

  var chips = el('div', 'chips');
  chips.setAttribute('role', 'group');
  chips.setAttribute('aria-label', 'Filter by status');
  var chipBtns = {};
  [['all', 'All'], ['running', 'Running'], ['done', 'Done'],
   ['failed', 'Failed'], ['waiting', 'Waiting']].forEach(function (c) {
    var b = el('button', 'chip', c[1]);
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { state.status = c[0]; paint(); });
    chipBtns[c[0]] = b;
    chips.appendChild(b);
  });
  bar.appendChild(chips);

  bar.appendChild(el('div', 'filter-gap'));

  var seg = el('div', 'seg');
  seg.setAttribute('role', 'group');
  seg.setAttribute('aria-label', 'Whose runs');
  var segBtns = {};
  [['mine', 'mine'], ['all', 'all']].forEach(function (s) {
    var b = el('button', null, s[1]);
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { state.scope = s[0]; paint(); });
    segBtns[s[0]] = b;
    seg.appendChild(b);
  });
  bar.appendChild(seg);
  center.appendChild(bar);

  /* =================================================================
     4. Column header — one row, sorts within every group
     ================================================================= */

  var colhead = el('div', 'grid colhead');
  colhead.setAttribute('role', 'row');
  var chevs = {};
  COLUMNS.forEach(function (c) {
    if (!c.sortable) {
      var s = el('div', 'ch-static ' + c.cls + (c.num ? ' num' : ''), c.label);
      if (c.num) s.style.textAlign = 'right';
      colhead.appendChild(s);
      return;
    }
    var b = el('button', 'ch ' + c.cls + (c.num ? ' num' : ''));
    b.type = 'button';
    b.appendChild(el('span', null, c.label));
    var chev = el('span', 'chv is-hidden');
    chev.innerHTML = icon('chevron-down', 10);
    b.appendChild(chev);
    chevs[c.key] = chev;
    b.addEventListener('click', function () {
      if (state.sortKey === c.key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = c.key;
        state.sortDir = 'asc';
      }
      paint();
    });
    b.dataset.key = c.key;
    colhead.appendChild(b);
  });
  center.appendChild(colhead);

  var listWrap = el('div', 'runs-list');
  center.appendChild(listWrap);

  /* =================================================================
     5. Rows
     ================================================================= */

  function buildRow(r) {
    var row = el('div', 'grid rrow');
    row.setAttribute('role', 'row');

    var star = el('button', 'star-btn' + (r.star ? ' is-on' : '') + ' c-star');
    star.type = 'button';
    star.innerHTML = icon('star', 13);
    star.setAttribute('aria-pressed', r.star ? 'true' : 'false');
    star.setAttribute('aria-label', (r.star ? 'Unstar ' : 'Star ') + r.title);
    star.addEventListener('click', function () {
      r.star = !r.star;
      star.classList.toggle('is-on', r.star);
      star.setAttribute('aria-pressed', r.star ? 'true' : 'false');
      star.setAttribute('aria-label', (r.star ? 'Unstar ' : 'Star ') + r.title);
    });
    row.appendChild(star);

    var main = el('div', 'rmain c-run');
    var a = el('a', 'rlink');
    a.href = '../0-baseline.html';
    a.appendChild(document.createTextNode(r.title));
    if (r.owner) a.appendChild(el('span', 'rowner', r.owner));
    main.appendChild(a);
    /* a running run shows where it is now, not its last summary */
    main.appendChild(el('div', 'rsub',
      r.status === 'running' && r.progress ? r.progress : r.latest));
    row.appendChild(main);
    a.addEventListener('focus', function () { row.classList.add('is-focus'); });
    a.addEventListener('blur', function () { row.classList.remove('is-focus'); });

    var st = el('div', 'rstatus c-status s-' + r.status);
    var g = el('span', 'glyph');
    g.innerHTML = glyph(r.status);
    st.appendChild(g);
    st.appendChild(el('span', 'word', STATUS_WORD[r.status] || r.status));
    row.appendChild(st);

    row.appendChild(el('div', 'num c-rounds', String(r.rounds)));
    row.appendChild(el('div', 'num c-runtime', r.runtime));
    row.appendChild(el('div', 'num c-cost', money(r.cost)));
    row.appendChild(el('div', 'rstarted c-started', r.started));

    var tr = el('div', 'rtrend c-trend');
    tr.innerHTML = sparkSvg(r.spark, 'Cost over time, ending ' + money(r.cost));
    row.appendChild(tr);

    return row;
  }

  /* =================================================================
     6. Paint
     ================================================================= */

  function paint() {
    Object.keys(chipBtns).forEach(function (k) {
      var on = state.status === k;
      chipBtns[k].classList.toggle('is-on', on);
      chipBtns[k].setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Object.keys(segBtns).forEach(function (k) {
      var on = state.scope === k;
      segBtns[k].classList.toggle('is-on', on);
      segBtns[k].setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(colhead.querySelectorAll('.ch'), function (b) {
      var on = b.dataset.key === state.sortKey;
      b.classList.toggle('is-sorted', on);
      b.setAttribute('aria-sort', on ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
      var chev = chevs[b.dataset.key];
      chev.classList.toggle('is-hidden', !on);
      chev.classList.toggle('is-up', on && state.sortDir === 'asc');
    });

    var rows = visible();
    listWrap.innerHTML = '';

    if (!rows.length) {
      listWrap.appendChild(el('div', 'empty',
        state.q ? 'No runs match “' + state.q.trim() + '”.' : 'No runs in this filter.'));
      return;
    }

    GROUPS.forEach(function (g) {
      var inGroup = rows.filter(function (r) { return r.group === g.key; });
      if (!inGroup.length) return;
      /* natural order is newest first; a sorted column overrides it */
      inGroup.sort(state.sortKey ? compare : function (a, b) { return a.ago - b.ago; });

      var box = el('div', 'rgroup');
      var head = el('div', 'ghead');
      head.appendChild(el('span', null, g.label));
      head.appendChild(el('span', 'gcount', String(inGroup.length)));
      box.appendChild(head);
      inGroup.forEach(function (r) { box.appendChild(buildRow(r)); });
      listWrap.appendChild(box);
    });
  }

  paint();
})();
</script>
