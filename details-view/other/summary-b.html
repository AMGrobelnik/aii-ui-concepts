<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Other screens — Completed-run summary, variant B (dossier)</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/chrome.css">
<style>
  /* the dossier runs edge to edge, so the hairline between the two
     columns reaches the full height of the scroller */
  .center { padding: 0; }

  .dossier {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    align-items: stretch;
    min-height: 100%;
  }

  /* ---- left: the paper front page ---- */
  .doc { min-width: 0; padding: 24px 28px 180px; }
  .paper {
    max-width: 760px;
    padding: 34px 38px 30px;
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .paper-title {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink-900);
    max-width: 32ch;
  }
  .paper-byline { margin-top: 8px; font-size: 12px; color: var(--ink-600); }
  .paper-rule { margin: 18px 0 16px; height: 1px; background: var(--hair); }
  .paper-lead { font-size: 12px; color: var(--ink-600); margin-bottom: 6px; }
  .paper-abstract {
    font-family: var(--font-serif);
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-900);
    max-width: 62ch;
  }

  .fig { margin-top: 22px; }
  .fig svg { width: 100%; height: auto; display: block; }
  .fig-cap {
    margin-top: 7px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-600);
    max-width: 62ch;
  }

  /* ---- right: the rail you act from ---- */
  .rail { border-left: 1px solid var(--hair); min-width: 0; }
  .rail-inner {
    position: sticky;
    top: 0;
    padding: 18px 16px 190px;
    max-height: calc(100vh - var(--review-h) - var(--topbar-h));
    overflow-y: auto;
  }
  .rail-h {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-900);
    padding-bottom: 7px;
    border-bottom: 1px solid var(--hair);
    margin-bottom: 10px;
  }
  .rail-sec { margin-top: 20px; }

  .facts {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 7px;
    column-gap: 12px;
    font-size: 12px;
  }
  .facts dt { color: var(--ink-600); }
  .facts dd { margin: 0; text-align: right; color: var(--ink-900); }
  .facts dd.num { font-family: var(--font-mono); }
  .facts dd.ok { color: var(--ok); }

  .numrow {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--hair-light);
  }
  .numrow:last-child { border-bottom: 0; }
  .nr-k { font-size: 12px; color: var(--ink-600); }
  .nr-v {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-900);
    white-space: nowrap;
  }

  .rail-btns { display: flex; flex-direction: column; gap: 6px; }
  .rail-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--hair-dark);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 12px;
    color: var(--ink-700);
    text-align: left;
  }
  .rail-btn:hover { background: var(--ground); color: var(--ink-900); }
  .rail-btn .rb-ico { flex: 0 0 auto; color: var(--ink-400); display: flex; }
  .rail-btn:hover .rb-ico { color: var(--ink-600); }

  .fork-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 28px;
    padding: 0 6px;
    border-radius: var(--radius-sm);
    text-align: left;
    font-size: 12px;
    color: var(--ink-700);
  }
  .fork-row:hover { background: var(--ground); color: var(--ink-900); }
  .fork-name, .rb-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fork-chev { flex: 0 0 auto; color: var(--ink-400); display: flex; }
  .rail-note { margin-top: 8px; font-size: 11px; line-height: 1.45; color: var(--ink-400); }

  @media (max-width: 1024px) {
    .dossier { grid-template-columns: minmax(0, 1fr); }
    .rail { border-left: 0; border-top: 1px solid var(--hair); }
    .rail-inner { position: static; max-height: none; padding-bottom: 200px; }
  }
</style>
</head>
<body data-page="other/summary-b">
<div id="app"></div>

<script src="../shared/data.js"></script>
<script src="../shared/chrome.js"></script>
<script src="../shared/feedback.js"></script>
<script>
(function () {
  'use strict';
  var AII = window.AII;
  var el = AII.el, icon = AII.icon;
  var S = AII.RUN_SUMMARY, RUN = AII.RUN;

  var center = AII.renderShell(document.getElementById('app'), {
    finished: true,
    title: 'Other screens · Completed-run summary',
    variant: 'Variant B — dossier',
    blurb: 'The run as a document to read, with everything you can act on kept in one rail.',
    prev: 'summary-a.html',
    next: 'progress-a.html',
    indexHref: '../index.html',
    activeTab: 'Overview',
    hideLeft: true,
    hideRight: true,
    hideComposer: true
  });

  function commas(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  var wrap = el('div', 'dossier');
  center.appendChild(wrap);

  /* =============== left: the paper front page =============== */

  var doc = el('div', 'doc');
  var paper = el('article', 'paper');
  paper.appendChild(el('h1', 'paper-title', S.outputs.paper.title));
  paper.appendChild(el('div', 'paper-byline', 'AI Inventor run ' + RUN.id));
  paper.appendChild(el('div', 'paper-rule'));
  paper.appendChild(el('div', 'paper-lead', 'Abstract'));
  paper.appendChild(el('p', 'paper-abstract', S.abstract));

  /* Grey stand-ins for the three rendered figures: shape varies so the
     three are distinguishable, but nothing here plots real numbers. */
  function figureSvg(kind) {
    var body;
    if (kind === 0) {
      body = '';
      [[86, 66], [116, 52], [176, 58], [206, 40], [266, 50], [296, 22]]
        .forEach(function (b) {
          body += '<rect x="' + b[0] + '" y="' + (170 - b[1]) + '" width="24" height="' +
            b[1] + '" fill="#d9dbe6"/>';
        });
      body += '<rect x="356" y="120" width="24" height="50" fill="#d9dbe6"/>' +
        '<rect x="386" y="102" width="24" height="68" fill="#d9dbe6"/>' +
        '<rect x="446" y="112" width="24" height="58" fill="#d9dbe6"/>' +
        '<rect x="476" y="58" width="24" height="112" fill="#d9dbe6"/>';
    } else if (kind === 1) {
      body = '<rect x="90" y="46" width="180" height="30" fill="#d9dbe6"/>' +
        '<rect x="90" y="110" width="86" height="30" fill="#d9dbe6"/>' +
        '<line x1="90" y1="30" x2="90" y2="160" stroke="#8b8da3" stroke-width="1"/>';
    } else {
      body = '';
      var h = [8, 16, 27, 44, 63, 82, 96, 104, 99, 86, 68, 49, 33, 21, 13, 7];
      h.forEach(function (v, i) {
        body += '<rect x="' + (96 + i * 26) + '" y="' + (170 - v) + '" width="22" height="' +
          v + '" fill="#d9dbe6"/>';
      });
      body += '<line x1="330" y1="24" x2="330" y2="170" stroke="#8b8da3" ' +
        'stroke-width="1" stroke-dasharray="3 3"/>';
    }
    return '<svg viewBox="0 0 620 200" role="img" aria-label="Figure preview placeholder">' +
      '<rect x="0.5" y="0.5" width="619" height="199" fill="#ebedf4" stroke="#d9dbe6" stroke-width="1"/>' +
      body +
      '<line x1="60" y1="170.5" x2="560" y2="170.5" stroke="#8b8da3" stroke-width="1"/>' +
    '</svg>';
  }

  S.outputs.figures.forEach(function (f, i) {
    var fig = el('figure', 'fig');
    var box = el('div');
    box.innerHTML = figureSvg(i);
    fig.appendChild(box.firstChild);
    fig.appendChild(el('figcaption', 'fig-cap', 'Figure ' + (i + 1) + '. ' + f.caption));
    paper.appendChild(fig);
  });

  doc.appendChild(paper);
  wrap.appendChild(doc);

  /* =============== right: the rail =============== */

  var rail = el('aside', 'rail');
  rail.setAttribute('aria-label', 'Run facts and actions');
  var inner = el('div', 'rail-inner');

  function railSection(name, first) {
    var s = el('section', first ? null : 'rail-sec');
    s.appendChild(el('h2', 'rail-h', name));
    inner.appendChild(s);
    return s;
  }

  /* --- facts --- */
  var facts = el('dl', 'facts');
  [['Status', 'Done', 'ok'],
   ['Rounds', String(S.rounds), 'num'],
   ['Cost', '$' + S.cost.total.toFixed(2), 'num'],
   ['Runtime', S.runtime.total, 'num'],
   ['Tokens', commas(S.tokens), 'num'],
   ['Errors recovered', String(S.errorsRecovered), 'num'],
   ['Human steers', String(S.steers), 'num']].forEach(function (f) {
    facts.appendChild(el('dt', null, f[0]));
    facts.appendChild(el('dd', f[2], f[1]));
  });
  railSection('Facts', true).appendChild(facts);

  /* --- results as small number rows --- */
  var resSec = railSection('Results');
  S.results.forEach(function (r) {
    var row = el('div', 'numrow');
    row.appendChild(el('span', 'nr-k', r.label));
    row.appendChild(el('span', 'nr-v mono', r.value));
    resSec.appendChild(row);
  });

  /* --- the four things you can open --- */
  var openSec = railSection('Open');
  var btns = el('div', 'rail-btns');
  [['file-text', 'Paper', S.outputs.paper.pages + ' pages'],
   ['github', 'Repo', S.outputs.repo.files + ' files'],
   ['play', 'Demo', 'live'],
   ['list-todo', 'Trace', commas(S.events) + ' events']].forEach(function (b) {
    var btn = el('button', 'rail-btn');
    btn.type = 'button';
    var ic = el('span', 'rb-ico');
    ic.innerHTML = icon(b[0], 13);
    btn.appendChild(ic);
    btn.appendChild(el('span', 'rb-name', b[1]));
    btn.appendChild(el('span', 'nr-k mono', b[2]));
    btns.appendChild(btn);
  });
  openSec.appendChild(btns);

  /* --- fork from: the six modules of Round 2 --- */
  var forkSec = railSection('Fork from');
  var round2 = null;
  AII.normalizePhases().forEach(function (p) {
    p.children.forEach(function (c) { if (c.name === 'Round 2') round2 = c; });
  });
  (round2 ? round2.children : []).forEach(function (m) {
    var b = el('button', 'fork-row');
    b.type = 'button';
    b.appendChild(el('span', 'fork-name', m.name));
    var ch = el('span', 'fork-chev');
    ch.innerHTML = icon('chevron-right', 12);
    b.appendChild(ch);
    forkSec.appendChild(b);
  });
  forkSec.appendChild(el('p', 'rail-note',
    'A fork copies the run up to that module and re-runs everything after it.'));

  rail.appendChild(inner);
  wrap.appendChild(rail);
})();
</script>
</body>
</html>
