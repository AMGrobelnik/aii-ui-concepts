<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Other screens — Pipeline progress, variant A (rail)</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/chrome.css">
<style>
  .center { padding: 0; }

  .prog {
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    align-items: stretch;
    min-height: 100%;
  }

  /* ---- the rail ---- */
  .rail {
    border-right: 1px solid var(--hair);
    padding: 14px 12px 24px;
    min-width: 0;
  }

  .ph { margin-top: 18px; }
  .ph:first-child { margin-top: 0; }
  .ph-h {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 6px 6px;
    border-bottom: 1px solid var(--hair);
    margin-bottom: 4px;
  }
  .ph-name { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600; color: var(--ink-900); }
  .ph-meta { flex: 0 0 auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-400); }

  .rd-h {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 6px 3px;
  }
  .rd-name { flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; color: var(--ink-700); }

  .mrow {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 28px;
    padding: 0 6px;
    border-radius: var(--radius-sm);
    text-align: left;
  }
  .mrow:hover { background: var(--ground); }
  .mrow.is-open { background: var(--ground); }
  .m-glyph { flex: 0 0 10px; width: 10px; height: 10px; display: flex; }
  .m-name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 12px;
    color: var(--ink-700);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mrow.is-sub .m-name { color: var(--ink-600); }
  .m-meta {
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-400);
    white-space: nowrap;
  }

  /* substeps of Create Artifacts, indented under a 1 px connector */
  .subs { position: relative; padding-left: 16px; }
  .subs::before {
    content: "";
    position: absolute;
    left: 11px;
    top: 0;
    bottom: 14px;
    width: 1px;
    background: var(--ink-200);
  }

  /* the retried module, expanded inline */
  .attempts {
    margin: 2px 0 6px 16px;
    padding: 6px 0 6px 10px;
    border-left: 1px solid var(--ink-200);
  }
  .att {
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-600);
  }
  .att + .att { margin-top: 5px; }
  .att-bad { color: var(--danger); }
  .att-mono { font-family: var(--font-mono); }

  .legend {
    margin-top: 20px;
    padding: 10px 6px 0;
    border-top: 1px solid var(--hair);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    font-size: 11px;
    color: var(--ink-400);
  }
  .lg { display: inline-flex; align-items: center; gap: 5px; }

  /* ---- right of the rail: the two boxes ---- */
  .side { min-width: 0; padding: 16px 20px 180px; }
  .box {
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    background: var(--surface);
    max-width: 720px;
  }
  .box + .box { margin-top: 14px; }
  .box-h {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--hair);
  }
  .box-t { font-size: 13px; font-weight: 600; color: var(--ink-900); }
  .box-n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-400); }
  .box-b { padding: 12px; }
  .summary-p {
    font-family: var(--font-serif);
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-900);
    max-width: 62ch;
  }

  .act {
    display: flex;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--hair-light);
  }
  .act:last-child { border-bottom: 0; }
  .act-t {
    flex: 0 0 58px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-400);
    padding-top: 1px;
  }
  .act-x { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 1.45; color: var(--ink-700); }

  @media (max-width: 1024px) {
    .prog { grid-template-columns: minmax(0, 1fr); }
    .rail { border-right: 0; border-bottom: 1px solid var(--hair); }
  }
</style>
</head>
<body data-page="other/progress-a">
<div id="app"></div>

<script src="../shared/data.js"></script>
<script src="../shared/chrome.js"></script>
<script src="../shared/feedback.js"></script>
<script>
(function () {
  'use strict';
  var AII = window.AII;
  var el = AII.el, esc = AII.escapeHtml;
  var S = AII.RUN_SUMMARY;

  var center = AII.renderShell(document.getElementById('app'), {
    finished: true,
    title: 'Other screens · Pipeline progress',
    variant: 'Variant A — rail',
    blurb: 'One rail for the whole pipeline, where a failed module cannot look like one that never started.',
    prev: 'summary-b.html',
    next: 'progress-b.html',
    indexHref: '../index.html',
    activeTab: 'Overview',
    hideLeft: true,
    hideRight: true,
    hideComposer: true
  });

  /* =================================================================
     State glyphs — 10 px, one per state, drawn here
     ================================================================= */

  var OK = '#16a34a', DANGER = '#dc2626', WARN = '#d97706',
      BRAND = '#0d9488', INK4 = '#8b8da3';

  var GLYPH = {
    'not-started': '<circle cx="6" cy="6" r="4.4" fill="none" stroke="' + INK4 + '" stroke-width="1.3"/>',
    running: '<circle cx="6" cy="6" r="4.4" fill="none" stroke="' + BRAND + '" stroke-width="1.3"/>' +
             '<circle cx="6" cy="6" r="1.9" fill="' + BRAND + '"/>',
    done: '<circle cx="6" cy="6" r="5" fill="' + OK + '"/>',
    failed: '<circle cx="6" cy="6" r="5" fill="' + DANGER + '"/>' +
            '<path d="M4.2 4.2l3.6 3.6M7.8 4.2l-3.6 3.6" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>',
    retried: '<circle cx="6" cy="6" r="5" fill="' + WARN + '"/>' +
             '<path d="M8.5 6.4a2.5 2.5 0 1 1-1-2.3" fill="none" stroke="#fff" ' +
             'stroke-width="1.2" stroke-linecap="round"/>' +
             '<path d="M8.2 1.9v2.3H6" fill="none" stroke="#fff" stroke-width="1.2" ' +
             'stroke-linecap="round" stroke-linejoin="round"/>',
    skipped: '<circle cx="6" cy="6" r="4.4" fill="none" stroke="' + INK4 + '" stroke-width="1.3" ' +
             'stroke-dasharray="2.2 2"/>',
    waiting: '<rect x="2.9" y="1.6" width="2" height="8.8" rx="1" fill="' + BRAND + '"/>' +
             '<rect x="7.1" y="1.6" width="2" height="8.8" rx="1" fill="' + BRAND + '"/>'
  };

  var STATE_WORD = {
    'not-started': 'not started', running: 'running', done: 'done',
    failed: 'failed', retried: 'retried after a failure', skipped: 'skipped',
    waiting: 'waiting on human'
  };

  function glyphSvg(state, size) {
    var s = size || 10;
    return '<svg viewBox="0 0 12 12" width="' + s + '" height="' + s + '" role="img" ' +
      'aria-label="' + esc(STATE_WORD[state] || state) + '">' +
      (GLYPH[state] || GLYPH['not-started']) + '</svg>';
  }

  function stateOf(node) {
    var s = String(node.status || 'done').toLowerCase();
    if (s === 'not_started' || s === 'pending') return 'not-started';
    if (GLYPH[s]) return s;
    return 'done';
  }

  function money(v) { return typeof v === 'number' ? '$' + v.toFixed(2) : String(v || ''); }

  /* =================================================================
     The rail
     ================================================================= */

  var wrap = el('div', 'prog');
  center.appendChild(wrap);

  var rail = el('nav', 'rail');
  rail.setAttribute('aria-label', 'Pipeline progress');

  function moduleRow(node, isSub, parent) {
    var state = stateOf(node);
    var row = el('button', 'mrow' + (isSub ? ' is-sub' : ''));
    row.type = 'button';
    var g = el('span', 'm-glyph');
    g.innerHTML = glyphSvg(state, 10);
    row.appendChild(g);
    row.appendChild(el('span', 'm-name', node.name));
    var meta = state === 'skipped'
      ? 'skipped'
      : [node.duration, money(node.cost)].filter(Boolean).join('  ');
    row.appendChild(el('span', 'm-meta mono', meta));
    row.title = node.name + ' — ' + (STATE_WORD[state] || state) +
      (node.note ? ': ' + node.note : '');
    parent.appendChild(row);

    /* a retried module carries its attempts, shown open on this mockup */
    if (node.attempts && node.attempts.length) {
      var box = el('div', 'attempts');
      node.attempts.forEach(function (a, i) {
        var line = el('div', 'att');
        if (a.status === 'failed') {
          line.innerHTML = 'Attempt ' + (i + 1) + ' <span class="att-bad">failed</span> after ' +
            '<span class="att-mono">' + esc(a.duration) + '</span>' +
            (a.error ? ' — ' + esc(a.error) : '');
        } else {
          line.innerHTML = 'Attempt ' + (i + 1) + ' ' + esc(a.status) + ' in ' +
            '<span class="att-mono">' + esc(a.duration) + '</span>';
        }
        box.appendChild(line);
      });
      parent.appendChild(box);
      row.classList.add('is-open');
      row.setAttribute('aria-expanded', 'true');
      row.addEventListener('click', function () {
        var open = box.hidden;
        box.hidden = !open;
        row.classList.toggle('is-open', open);
        row.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
    return row;
  }

  function moduleList(nodes, parent) {
    nodes.forEach(function (m) {
      moduleRow(m, false, parent);
      if (m.children && m.children.length) {
        var subs = el('div', 'subs');
        m.children.forEach(function (s) { moduleRow(s, true, subs); });
        parent.appendChild(subs);
      }
    });
  }

  AII.PHASES.forEach(function (p) {
    var sec = el('section', 'ph');
    var head = el('div', 'ph-h');
    head.appendChild(el('span', 'ph-name', p.name));
    head.appendChild(el('span', 'ph-meta mono', p.duration + '  ' + money(p.cost)));
    sec.appendChild(head);

    var rounds = (p.children || []).filter(function (c) { return c.kind === 'round'; });
    if (rounds.length) {
      rounds.forEach(function (r) {
        var rh = el('div', 'rd-h');
        rh.appendChild(el('span', 'rd-name', r.name));
        rh.appendChild(el('span', 'ph-meta mono', r.duration + '  ' + money(r.cost)));
        sec.appendChild(rh);
        moduleList(r.children || [], sec);
      });
    } else {
      moduleList(p.children || [], sec);
    }
    rail.appendChild(sec);
  });

  var legend = el('div', 'legend');
  ['not-started', 'running', 'done', 'failed', 'retried', 'skipped', 'waiting']
    .forEach(function (s) {
      var item = el('span', 'lg');
      var g = el('span', 'm-glyph');
      g.innerHTML = glyphSvg(s, 10);
      item.appendChild(g);
      item.appendChild(el('span', null, STATE_WORD[s]));
      legend.appendChild(item);
    });
  rail.appendChild(legend);
  wrap.appendChild(rail);

  /* =================================================================
     Right of the rail: Summary and Activity
     ================================================================= */

  var side = el('div', 'side');

  function box(title, note) {
    var b = el('section', 'box');
    var h = el('div', 'box-h');
    h.appendChild(el('h2', 'box-t', title));
    if (note) h.appendChild(el('span', 'box-n mono', note));
    b.appendChild(h);
    var body = el('div', 'box-b');
    b.appendChild(body);
    side.appendChild(b);
    return body;
  }

  /* the interim narrative, cut to its first 60 words */
  var words = String(S.abstract).split(/\s+/);
  var sixty = words.slice(0, 60).join(' ') + (words.length > 60 ? '…' : '');
  box('Summary', 'written every 2 min').appendChild(el('p', 'summary-p', sixty));

  var actBody = box('Activity', 'last 8 entries');
  [['02:24:07', 'Published the paper, the repository and the demo'],
   ['02:15:52', 'Wrote the full paper: 14 pages, 3 figures'],
   ['02:07:38', 'Rendered figure 3, the paired bootstrap over 2000 draws'],
   ['01:58:04', 'Round 2 closed: exact match 74.9 on the held-out 500'],
   ['01:52:19', 'Write Paper succeeded on the second attempt, 4 m 02 s'],
   ['01:48:39', 'Write Paper failed: LaTeX could not resolve \\cite at line 212'],
   ['01:44:11', 'Evaluation 1 finished: +6.8 exact match above 8k tokens'],
   ['01:36:27', 'Steer accepted: also report per-length buckets']].forEach(function (a) {
    var row = el('div', 'act');
    row.appendChild(el('span', 'act-t mono', a[0]));
    row.appendChild(el('span', 'act-x', a[1]));
    actBody.appendChild(row);
  });

  wrap.appendChild(side);
})();
</script>
</body>
</html>
