<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Other screens — Completed-run summary, variant A (reading order)</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/chrome.css">
<style>
  /* ---- one 760 px reading column, left-aligned ---- */
  .col {
    max-width: 760px;
    /* the feedback widget docks bottom-right; keep the tail scrollable clear */
    padding-bottom: 160px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-400);
  }
  .verdict {
    margin-top: 10px;
    font-family: var(--font-serif);
    font-size: 20px;
    line-height: 1.4;
    color: var(--ink-900);
  }

  .sec { margin-top: 34px; }
  .sec-h {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-900);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--hair);
    margin-bottom: 14px;
  }

  /* ---- hypothesis: before / after ---- */
  .hyp { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .hyp-k { font-size: 12px; color: var(--ink-600); margin-bottom: 6px; }
  .hyp-t { font-size: 13px; line-height: 1.5; color: var(--ink-900); }
  /* the clause that moved is underlined, never coloured */
  .hyp-chg {
    text-decoration: underline;
    text-decoration-color: var(--ink-400);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }

  /* ---- three results ---- */
  .res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .res-k { font-size: 12px; color: var(--ink-600); }
  .res-v {
    font-family: var(--font-mono);
    font-size: 20px;
    line-height: 1.3;
    color: var(--ink-900);
    margin: 5px 0 6px;
  }
  .res-e { font-size: 12px; line-height: 1.45; color: var(--ink-600); }

  /* ---- outputs: a hairline list with inline previews ---- */
  .out { border-top: 1px solid var(--hair); }
  .out-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 10px 4px;
    text-align: left;
    border-bottom: 1px solid var(--hair);
  }
  .out-row:hover { background: var(--ground); }
  .out-media {
    flex: 0 0 96px;
    width: 96px;
    height: 64px;
    display: grid;
    place-items: center;
    color: var(--ink-400);
  }
  .out-main { flex: 1 1 auto; min-width: 0; }
  .out-t { display: block; font-size: 13px; color: var(--ink-900); }
  .out-d { display: block; margin-top: 2px; font-size: 12px; line-height: 1.45; color: var(--ink-600); }
  .out-open { flex: 0 0 auto; font-size: 12px; color: var(--azure); }
  .out-row:hover .out-open { text-decoration: underline; }

  /* ---- cost and time: two 10 px stacked bars, labels beneath ---- */
  .bar-block + .bar-block { margin-top: 24px; }
  .bar-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--ink-600);
  }
  .bar-total { font-family: var(--font-mono); font-size: 13px; color: var(--ink-900); }
  .bar { display: flex; gap: 1px; height: 10px; width: 100%; }
  .bar-seg { height: 10px; min-width: 2px; }
  .bar-keys {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 20px;
    margin-top: 9px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-600);
  }
  .bar-key { display: inline-flex; align-items: center; gap: 6px; }
  .bar-sw { width: 8px; height: 8px; border-radius: 1px; flex: 0 0 8px; }

  /* ---- what happened: the three phase cards, laid horizontally ---- */
  .phases-h { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .phase-card {
    display: block;
    width: 100%;
    padding: 9px 10px;
    text-align: left;
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .phase-card:hover { background: var(--ground); }
  .pc-top { display: flex; align-items: center; gap: 6px; }
  .pc-name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pc-meta {
    display: block;
    margin-top: 3px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-400);
  }
</style>
</head>
<body data-page="other/summary-a">
<div id="app"></div>

<script src="../shared/data.js"></script>
<script src="../shared/chrome.js"></script>
<script src="../shared/feedback.js"></script>
<script>
(function () {
  'use strict';
  var AII = window.AII;
  var el = AII.el, esc = AII.escapeHtml, icon = AII.icon;
  var S = AII.RUN_SUMMARY, RUN = AII.RUN;

  var center = AII.renderShell(document.getElementById('app'), {
    finished: true,
    title: 'Other screens · Completed-run summary',
    variant: 'Variant A — reading order',
    blurb: 'The finished run read top to bottom: verdict, hypothesis, results, outputs, cost.',
    prev: '../7-rows.html',
    next: 'summary-b.html',
    indexHref: '../index.html',
    activeTab: 'Overview',
    hideLeft: true,
    hideRight: true,
    hideComposer: true
  });

  var col = el('div', 'col');
  center.appendChild(col);

  function section(name) {
    var s = el('section', 'sec');
    s.appendChild(el('h2', 'sec-h', name));
    col.appendChild(s);
    return s;
  }

  /* ---------------- verdict ---------------- */

  col.appendChild(el('div', 'eyebrow',
    'Run ' + RUN.id + ' · finished · ' + S.rounds + ' rounds · ' +
    S.runtime.total + ' · $' + S.cost.total.toFixed(2)));
  col.appendChild(el('p', 'verdict', S.verdict));

  /* ---------------- hypothesis ---------------- */

  var hyp = section('Hypothesis');
  var grid = el('div', 'hyp');

  function hypCol(label, text, changed) {
    var c = el('div');
    c.appendChild(el('div', 'hyp-k', label));
    var p = el('p', 'hyp-t');
    var at = changed ? text.indexOf(changed) : -1;
    if (at < 0) {
      p.textContent = text;
    } else {
      /* underline the clause that moved between the two statements */
      p.innerHTML = esc(text.slice(0, at)) +
        '<span class="hyp-chg">' + esc(changed) + '</span>' +
        esc(text.slice(at + changed.length));
    }
    c.appendChild(p);
    return c;
  }
  grid.appendChild(hypCol('As first stated', S.hypothesis.before, null));
  grid.appendChild(hypCol('As finally stated', S.hypothesis.after, S.hypothesis.changedClause));
  hyp.appendChild(grid);

  /* ---------------- results ---------------- */

  var res = section('Results');
  var rgrid = el('div', 'res');
  S.results.forEach(function (r) {
    var c = el('div');
    c.appendChild(el('div', 'res-k', r.label));
    c.appendChild(el('div', 'res-v mono', r.value));
    c.appendChild(el('div', 'res-e', r.evidence));
    rgrid.appendChild(c);
  });
  res.appendChild(rgrid);

  /* ---------------- outputs ---------------- */

  /* A 96 x 64 grey placeholder standing in for a rendered figure. */
  function figurePlaceholder() {
    return '<svg viewBox="0 0 96 64" width="96" height="64" role="img" ' +
      'aria-label="Figure preview placeholder">' +
      '<rect x="0.5" y="0.5" width="95" height="63" fill="#ebedf4" ' +
        'stroke="#d9dbe6" stroke-width="1"/>' +
      '<rect x="14" y="34" width="9" height="16" fill="#d9dbe6"/>' +
      '<rect x="29" y="26" width="9" height="24" fill="#d9dbe6"/>' +
      '<rect x="44" y="30" width="9" height="20" fill="#d9dbe6"/>' +
      '<rect x="59" y="18" width="9" height="32" fill="#d9dbe6"/>' +
      '<line x1="10" y1="50.5" x2="86" y2="50.5" stroke="#8b8da3" stroke-width="1"/>' +
    '</svg>';
  }

  var out = section('Outputs');
  var list = el('div', 'out');

  function outRow(media, title, detail) {
    var b = el('button', 'out-row');
    b.type = 'button';
    var m = el('span', 'out-media');
    m.innerHTML = media;
    b.appendChild(m);
    var main = el('span', 'out-main');
    main.appendChild(el('span', 'out-t', title));
    main.appendChild(el('span', 'out-d', detail));
    b.appendChild(main);
    b.appendChild(el('span', 'out-open', 'Open'));
    list.appendChild(b);
  }

  outRow(icon('file-text', 20), S.outputs.paper.title,
    'Paper, ' + S.outputs.paper.pages + ' pages, PDF and LaTeX source');
  outRow(icon('github', 20), 'Repository for the run',
    S.outputs.repo.files + ' files, one commit per module, tests included');
  outRow(icon('play', 20), 'Interactive demo',
    'Ask a long-context question and watch the pre-filter choose chunks');
  S.outputs.figures.forEach(function (f, i) {
    outRow(figurePlaceholder(), 'Figure ' + (i + 1), f.caption);
  });
  out.appendChild(list);

  /* ---------------- cost and time ---------------- */

  var ct = section('Cost and time');

  function barBlock(caption, total, segs) {
    var block = el('div', 'bar-block');
    var head = el('div', 'bar-head');
    head.appendChild(el('span', null, caption));
    head.appendChild(el('span', 'bar-total mono', total));
    block.appendChild(head);

    var bar = el('div', 'bar');
    bar.setAttribute('role', 'img');
    bar.setAttribute('aria-label', caption + ': ' + segs.map(function (s) {
      return s.label + ' ' + s.value;
    }).join(', '));
    segs.forEach(function (s) {
      var seg = el('span', 'bar-seg');
      seg.style.flex = s.n + ' 1 0';
      seg.style.background = s.color;
      bar.appendChild(seg);
    });
    block.appendChild(bar);

    var keys = el('div', 'bar-keys');
    segs.forEach(function (s) {
      var k = el('span', 'bar-key');
      var sw = el('span', 'bar-sw');
      sw.style.background = s.color;
      k.appendChild(sw);
      k.appendChild(el('span', null, s.label + ' ' + s.value));
      keys.appendChild(k);
    });
    block.appendChild(keys);
    ct.appendChild(block);
  }

  var c = S.cost;
  barBlock('Cost by kind of work', '$' + c.total.toFixed(2), [
    { label: 'tokens', value: '$' + c.tokens.toFixed(2), n: c.tokens, color: 'var(--ink-600)' },
    { label: 'search', value: '$' + c.search.toFixed(2), n: c.search, color: 'var(--ink-200)' },
    { label: 'containers', value: '$' + c.containers.toFixed(2), n: c.containers, color: 'var(--ink-400)' },
    { label: 'summaries', value: '$' + c.summaries.toFixed(2), n: c.summaries, color: 'var(--brand)' }
  ]);

  var rt = S.runtime;
  barBlock('Runtime by phase', rt.total, [
    { label: 'Create Idea', value: rt.create, n: 30, color: 'var(--ink-400)' },
    { label: 'Test Idea', value: rt.test, n: 88, color: 'var(--ink-600)' },
    { label: 'Report Results', value: rt.report, n: 26, color: 'var(--ink-200)' }
  ]);

  /* ---------------- what happened ---------------- */

  var wh = section('What happened');
  var cards = el('div', 'phases-h');
  AII.normalizePhases().forEach(function (p) {
    var b = el('button', 'phase-card');
    b.type = 'button';
    var top = el('span', 'pc-top');
    top.appendChild(el('span', 'pc-name', p.name));
    var chk = el('span', 'phase-check');
    chk.innerHTML = icon('check', 12);
    top.appendChild(chk);
    b.appendChild(top);
    b.appendChild(el('span', 'pc-meta mono',
      [p.duration, p.cost].filter(Boolean).join('  ·  ')));
    cards.appendChild(b);
  });
  wh.appendChild(cards);
})();
</script>
</body>
</html>
