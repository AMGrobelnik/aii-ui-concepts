<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Details view — Variant 7: row anatomy alternatives</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/chrome.css">
<style>
  /* Variant 7 — three treatments of the SAME twelve events, stacked, so the
     row details can be picked independently of the grouping. The left and
     right columns are hidden; the width belongs to the rows. */

  .center { padding: 0; }

  .rows-page {
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: 100%;
    min-height: 0;
    padding: 16px 24px;
  }
  .rp {
    display: flex;
    flex-direction: column;
    flex: 1 1 0;
    min-height: 0;
    max-height: 326px;
  }
  .rp-label {
    flex: 0 0 auto;
    padding: 0 2px 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-900);
  }
  .rp-box {
    flex: 1 1 auto;
    min-height: 0;
    max-height: 300px;
    overflow-y: auto;
    padding: 6px;
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    background: var(--surface);
  }

  /* ---- (b) colour bar instead of circle and label ---- */

  .rb-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 7px 8px;
    text-align: left;
    border-radius: var(--radius-sm);
  }
  .rb-row:hover, .rb-row.is-open { background: var(--ground); }
  .rb-bar {
    flex: 0 0 4px;
    width: 4px;
    align-self: stretch;
    min-height: 30px;
    border-radius: 2px;
  }
  .rb-main { flex: 1 1 auto; min-width: 0; }
  .rb-sum {
    display: block;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rb-sum.is-pending { padding: 6px 0 5px; }
  .rb-sec {
    display: block;
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--ink-600);
  }
  .rb-chev { flex: 0 0 auto; margin-top: 5px; color: var(--ink-400); display: flex; }
  .rb-chev svg { transition: transform 120ms ease; }
  .rb-row.is-open .rb-chev svg { transform: rotate(90deg); }
  .rb-body { padding: 2px 8px 12px 22px; }

  /* ---- (c) two-column, inline raw body, folded runs ---- */

  .rc-row {
    display: grid;
    grid-template-columns: 84px 1fr;
    gap: 12px;
    width: 100%;
    padding: 5px 8px;
    text-align: left;
    border-radius: var(--radius-sm);
    align-items: start;
  }
  .rc-row:hover, .rc-row.is-open { background: var(--ground); }
  .rc-left { min-width: 0; }
  .rc-time {
    display: block;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-600);
  }
  .rc-pill {
    display: inline-block;
    margin-top: 2px;
    padding: 0 5px;
    border: 1px solid var(--hair-dark);
    border-radius: 3px;
    font-size: 10px;
    line-height: 15px;
    letter-spacing: .04em;
  }
  .rc-right { min-width: 0; }
  .rc-sum {
    display: block;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rc-sum.is-pending { padding: 6px 0 5px; }
  .rc-body { padding: 0 8px 10px 104px; }

  .rc-foldrow { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 5px 8px; }
  .rc-fold-right { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .rc-plus {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border: 1px solid var(--hair-dark);
    border-radius: 3px;
    background: var(--surface);
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1;
    color: var(--ink-600);
  }
  .rc-plus:hover { background: var(--ground); color: var(--ink-900); }
  .rc-foldtext {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-600);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body data-page="details/7-rows">
<div id="app"></div>

<script src="shared/data.js"></script>
<script src="shared/chrome.js"></script>
<script src="shared/feedback.js"></script>
<script>
(function () {
  'use strict';
  var AII = window.AII;
  var el = AII.el;
  var esc = AII.escapeHtml;

  var center = AII.renderShell(document.getElementById('app'), {
    title: 'Details view',
    variant: 'Variant 7 of 7 — row anatomy alternatives',
    blurb: 'The same twelve events three times over, so row details can be ' +
           'chosen separately from the grouping.',
    prev: '6-decisions.html',
    next: null,
    activeTab: 'Details',
    hideLeft: true,
    hideRight: true,
    hideComposer: true
  });

  /* Events 44-55 of the substep: the six identical SKILL rows plus the
     neighbours on either side, so treatment (c) has a run to fold. */
  var events = AII.flattenSubstep(AII.SUBSTEP).slice(44, 56);

  /* SPEC §5 puts the cost on rows over $0.05. The authored substep tops out
     at $0.04 a row, so at that threshold the treatment renders on nothing
     and cannot be judged; $0.02 marks the same rows the rule meant — the
     agent turns — and leaves the cheap tool rows bare. */
  var COST_MIN = 0.02;

  function toolName(type) {
    var t = String(type || '').toUpperCase();
    return t.charAt(0) + t.slice(1).toLowerCase();
  }
  function rawBlocks(ev) {
    return '<div class="raw-block"><div class="raw-k">Tool input</div>' +
      '<pre class="raw-pre">' + esc(ev.input || '(no input recorded)') + '</pre></div>' +
      '<div class="raw-block"><div class="raw-k">Tool output</div>' +
      '<pre class="raw-pre">' + esc(ev.output || '(no output recorded)') + '</pre></div>';
  }

  function panel(label, build) {
    var wrap = el('section', 'rp');
    wrap.appendChild(el('div', 'rp-label', label));
    var box = el('div', 'rp-box');
    box.setAttribute('role', 'region');
    box.setAttribute('aria-label', label);
    build(box);
    wrap.appendChild(box);
    return wrap;
  }

  /* ---------------- (a) today's row + timestamp + cost ---------------- */

  function buildA(box) {
    events.forEach(function (ev) {
      var meta = ev.t;
      if (typeof ev.usd === 'number' && ev.usd > COST_MIN) {
        meta += ' · $' + ev.usd.toFixed(2);
      }
      box.appendChild(AII.buildRow(ev, { meta: meta }));
    });
  }

  /* ---------------- (b) colour bar, no circle, no type label ---------- */

  function buildB(box) {
    events.forEach(function (ev) {
      var color = AII.rowColor(ev.type);
      var item = el('div', 'rb-item');

      var btn = el('button', 'rb-row');
      btn.type = 'button';
      var sec = toolName(ev.type) + (ev.dur ? ' · ' + ev.dur : '');
      var sum = ev.summary
        ? '<span class="rb-sum">' + esc(ev.summary) + '</span>'
        : '<span class="rb-sum is-pending"><span class="skeleton"></span></span>';
      btn.innerHTML =
        '<span class="rb-bar" style="background:' + color + '"></span>' +
        '<span class="rb-main">' + sum +
          '<span class="rb-sec">' + esc(sec) + '</span>' +
        '</span>' +
        '<span class="rb-chev">' + AII.icon('chevron-right', 12) + '</span>';
      item.appendChild(btn);

      var body = el('div', 'rb-body');
      body.hidden = true;
      body.innerHTML = rawBlocks(ev);
      item.appendChild(body);

      btn.setAttribute('aria-expanded', 'false');
      btn.addEventListener('click', function () {
        var open = body.hidden;
        body.hidden = !open;
        btn.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      box.appendChild(item);
    });
  }

  /* ---------------- (c) two columns, inline raw, folded runs ---------- */

  function rowC(ev) {
    var color = AII.rowColor(ev.type);
    var item = el('div', 'rc-item');

    var btn = el('button', 'rc-row');
    btn.type = 'button';
    var sum = ev.summary
      ? '<span class="rc-sum">' + esc(ev.summary) + '</span>'
      : '<span class="rc-sum is-pending"><span class="skeleton"></span></span>';
    btn.innerHTML =
      '<span class="rc-left">' +
        '<span class="rc-time mono">' + esc(ev.t || '') + '</span>' +
        '<span class="rc-pill mono" style="color:' + color + '">' +
          esc(toolName(ev.type)) + '</span>' +
      '</span>' +
      '<span class="rc-right">' + sum + '</span>';
    item.appendChild(btn);

    var body = el('div', 'rc-body');
    body.hidden = true;
    body.innerHTML = rawBlocks(ev);
    item.appendChild(body);

    btn.setAttribute('aria-expanded', 'false');
    btn.addEventListener('click', function () {
      var open = body.hidden;
      body.hidden = !open;
      btn.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    return item;
  }

  function foldC(run) {
    var first = run[0];
    var item = el('div', 'rc-item');

    var head = el('div', 'rc-foldrow');
    var left = el('span', 'rc-left');
    left.appendChild(el('span', 'rc-time mono', first.t || ''));
    head.appendChild(left);

    var right = el('div', 'rc-fold-right');
    var plus = el('button', 'rc-plus', '+');
    plus.type = 'button';
    plus.setAttribute('aria-expanded', 'false');
    plus.setAttribute('aria-label', 'Unfold ' + run.length + ' identical rows');
    right.appendChild(plus);
    right.appendChild(el('span', 'rc-foldtext',
      toolName(first.type) + ' ×' + run.length + ' · ' + first.summary));
    head.appendChild(right);
    item.appendChild(head);

    var kids = el('div', 'rc-kids');
    kids.hidden = true;
    run.forEach(function (ev) { kids.appendChild(rowC(ev)); });
    item.appendChild(kids);

    plus.addEventListener('click', function () {
      var open = kids.hidden;
      kids.hidden = !open;
      plus.textContent = open ? '−' : '+';
      plus.setAttribute('aria-expanded', open ? 'true' : 'false');
      plus.setAttribute('aria-label',
        (open ? 'Fold ' : 'Unfold ') + run.length + ' identical rows');
    });
    return item;
  }

  function buildC(box) {
    var i = 0;
    while (i < events.length) {
      var run = [events[i]];
      var j = i + 1;
      while (j < events.length &&
             events[j].type === events[i].type &&
             events[j].summary === events[i].summary) {
        run.push(events[j]);
        j++;
      }
      box.appendChild(run.length > 1 ? foldC(run) : rowC(events[i]));
      i = j;
    }
  }

  var page = el('div', 'rows-page');
  page.appendChild(panel('a. Today plus timestamp and cost', buildA));
  page.appendChild(panel('b. Colour bar instead of circle and label', buildB));
  page.appendChild(panel('c. Two-column with inline raw body and folded runs', buildC));
  center.appendChild(page);
})();
</script>
</body>
</html>
