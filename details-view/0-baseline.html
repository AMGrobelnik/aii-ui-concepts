<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Details view — Variant 0: today (control)</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/chrome.css">
<style>
  /* Variant 0 adds nothing to the shared row anatomy — that is the point. */
  .feed-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 0 8px 10px;
  }
  .feed-count { font-size: 11px; color: var(--ink-400); }
  .feed-empty { padding: 24px 8px; font-size: 13px; color: var(--ink-400); }
</style>
</head>
<body data-page="details/0-baseline">
<div id="app"></div>

<script src="shared/data.js"></script>
<script src="shared/chrome.js"></script>
<script src="shared/feedback.js"></script>
<script>
(function () {
  'use strict';
  var AII = window.AII;

  var center = AII.renderShell(document.getElementById('app'), {
    title: 'Details view',
    variant: 'Variant 0 of 7 — today (control)',
    blurb: 'The page as it is now: one flat list, no grouping, no timestamps.',
    prev: null,
    next: '1-turns.html',
    activeTab: 'Details'
  });

  var events = AII.flattenSubstep(AII.SUBSTEP);

  var head = AII.el('div', 'feed-head');
  head.appendChild(AII.el('div', 'feed-count',
    events.length + ' entries · Evaluation 1 · Round 2'));
  center.appendChild(head);

  if (!events.length) {
    center.appendChild(AII.el('div', 'feed-empty',
      'No events loaded — shared/data.js did not define SUBSTEP.'));
    return;
  }

  /* One row starts expanded, so the raw Tool input / Tool output blocks are
     visible without a click (SPEC §5, variant 0). */
  var RAW_TYPES = { TOOL: 1, TERMINAL: 1, READ: 1, WRITE: 1, EDIT: 1, FIND: 1, SEARCH: 1 };
  var openAt = -1;
  for (var i = 3; i < events.length; i++) {
    var e = events[i];
    if (RAW_TYPES[String(e.type).toUpperCase()] && e.input && e.output) { openAt = i; break; }
  }

  var list = AII.el('div', 'feed-list');
  events.forEach(function (ev, i) {
    list.appendChild(AII.buildRow(ev, { open: i === openAt }));
  });
  center.appendChild(list);
})();
</script>
</body>
</html>
