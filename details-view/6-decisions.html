<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Details view — Variant 6: decisions and artefacts first</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/chrome.css">
<style>
  /* Variant 6 — the seven decisions as one spine-joined sequence. The rows
     are still today's rows; they just start out behind a count. */

  .dec-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 0 8px 14px;
  }
  .dec-count { font-size: 11px; color: var(--ink-400); }
  .dec-note  { font-size: 11px; color: var(--ink-400); }

  /* the spine: 2 px, module accent, running the whole sequence */
  .dec-list { position: relative; padding-left: 24px; }
  .dec-list::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 5px;
    bottom: 7px;
    width: 2px;
    border-radius: 1px;
    background: var(--spine, var(--mod-orange));
  }

  .dec { position: relative; padding-bottom: 26px; }
  .dec:last-child { padding-bottom: 10px; }
  .dec::before {
    content: "";
    position: absolute;
    left: -24px;
    top: 4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--spine, var(--mod-orange));
  }

  .dec-kind {
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.4;
    color: var(--ink-600);
  }
  .dec-title {
    margin-top: 2px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--ink-900);
  }
  .dec-detail {
    margin-top: 5px;
    max-width: 72ch;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-600);
  }

  /* numbers: label above value, no fill, no hero number */
  .dec-nums { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 12px; }
  .dec-num-k { font-size: 11px; line-height: 1.3; color: var(--ink-600); }
  .dec-num-v {
    margin-top: 1px;
    font-family: var(--font-mono);
    font-size: 16px;
    line-height: 1.25;
    color: var(--ink-900);
  }

  .dec-files {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 16px;
    margin-top: 11px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--ink-600);
  }

  .dec-actions { margin-top: 12px; }
  .dec-events {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 9px;
    border: 1px solid var(--hair-dark);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 12px;
    color: var(--ink-700);
  }
  .dec-events:hover { background: var(--ground); color: var(--ink-900); }
  .dec-events svg { transition: transform 120ms ease; }
  .dec-events.is-open svg { transform: rotate(90deg); }

  /* rows keep their own 8 px padding, so pull the block back into line */
  .dec-rows { margin: 8px 0 0 -8px; }

  .dec-tail { padding: 2px 8px 8px; }
  .link-quiet { font-size: 12px; color: var(--azure); }
  .link-quiet:hover { text-decoration: underline; }

  .all-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 0 8px 10px;
  }
</style>
</head>
<body data-page="details/6-decisions">
<div id="app"></div>

<script src="shared/data.js"></script>
<script src="shared/chrome.js"></script>
<script src="shared/feedback.js"></script>
<script>
(function () {
  'use strict';
  var AII = window.AII;
  var el = AII.el;

  var center = AII.renderShell(document.getElementById('app'), {
    title: 'Details view',
    variant: 'Variant 6 of 7 — decisions and artefacts first',
    blurb: 'Hides the process: only the seven decisions and the artefacts they ' +
           'produced, for the reader who wants the outcome first.',
    prev: '5-timeline.html',
    next: '7-rows.html',
    activeTab: 'Details'
  });

  var events = AII.flattenSubstep(AII.SUBSTEP);
  var decisions = AII.DECISIONS || [];

  /* ---------------- the decisions view ---------------- */

  var decView = el('div', 'dec-view');

  var head = el('div', 'dec-head');
  head.appendChild(el('div', 'dec-count',
    decisions.length + ' decisions · Evaluation 1 · Round 2'));
  head.appendChild(el('div', 'dec-note',
    'Each count opens its own rows.'));
  decView.appendChild(head);

  var list = el('div', 'dec-list');
  list.style.setProperty('--spine', AII.MODULE_ACCENT);

  decisions.forEach(function (d) {
    var range = d.range || d.eventRange || [0, -1];
    var from = Math.max(0, range[0]);
    var to = Math.min(events.length - 1, range[1]);
    var slice = to >= from ? events.slice(from, to + 1) : [];

    var item = el('div', 'dec');
    item.appendChild(el('div', 'dec-kind', d.kind));
    item.appendChild(el('div', 'dec-title', d.title));
    item.appendChild(el('div', 'dec-detail', d.detail));

    if (d.numbers && d.numbers.length) {
      var nums = el('div', 'dec-nums');
      d.numbers.forEach(function (n) {
        var cell = el('div', 'dec-num');
        cell.appendChild(el('div', 'dec-num-k', n.label));
        cell.appendChild(el('div', 'dec-num-v mono', n.value));
        nums.appendChild(cell);
      });
      item.appendChild(nums);
    }

    /* "artefacts first" is half the premise, so the files are named here */
    if (d.files && d.files.length) {
      var files = el('div', 'dec-files');
      d.files.forEach(function (f) { files.appendChild(el('span', null, f)); });
      item.appendChild(files);
    }

    if (slice.length) {
      var rows = el('div', 'dec-rows');
      rows.hidden = true;
      slice.forEach(function (ev) { rows.appendChild(AII.buildRow(ev, {})); });

      var actions = el('div', 'dec-actions');
      var btn = el('button', 'dec-events');
      btn.type = 'button';
      btn.innerHTML = '<span>' + slice.length + ' events</span>' +
        AII.icon('chevron-right', 12);
      function setOpen(open) {
        rows.hidden = !open;
        btn.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      btn.addEventListener('click', function () { setOpen(rows.hidden); });
      setOpen(String(d.kind).toLowerCase() === 'error');
      actions.appendChild(btn);
      item.appendChild(actions);
      item.appendChild(rows);
    }

    list.appendChild(item);
  });
  decView.appendChild(list);

  var tail = el('div', 'dec-tail');
  var showAll = el('button', 'link-quiet', 'Show all ' + events.length + ' events');
  showAll.type = 'button';
  tail.appendChild(showAll);
  decView.appendChild(tail);

  /* ---------------- the full flat list it swaps to ---------------- */

  var allView = el('div', 'all-view');
  allView.hidden = true;

  var allHead = el('div', 'all-head');
  allHead.appendChild(el('div', 'dec-count',
    events.length + ' entries · Evaluation 1 · Round 2'));
  var back = el('button', 'link-quiet', 'Show the ' + decisions.length + ' decisions');
  back.type = 'button';
  allHead.appendChild(back);
  allView.appendChild(allHead);

  var flat = el('div', 'feed-list');
  events.forEach(function (ev) { flat.appendChild(AII.buildRow(ev, {})); });
  allView.appendChild(flat);

  function swap(toAll) {
    decView.hidden = toAll;
    allView.hidden = !toAll;
    center.scrollTop = 0;
    (toAll ? back : showAll).focus();
  }
  showAll.addEventListener('click', function () { swap(true); });
  back.addEventListener('click', function () { swap(false); });

  center.appendChild(decView);
  center.appendChild(allView);
})();
</script>
</body>
</html>
